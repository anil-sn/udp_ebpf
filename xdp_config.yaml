compiler:
  additional_flags: []
  debug_info: false
  optimization_level: O2
  warnings_as_errors: false
monitoring:
  enable_metrics: true
  export_prometheus: false
  log_file: xdp_pipeline.log
  prometheus_port: 9090
  stats_interval: 5
pipeline:
  allowlist_file: ip_allowlist.json
  auto_reload: false
  bpf_program: vxlan_pipeline.bpf.c
  interface: ens5
  log_level: info
  max_entries: 10000
  performance_mode: true
  src_directory: src
